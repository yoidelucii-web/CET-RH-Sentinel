name: CET RH Sentinel

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check OpenSea module
        run: node --check src/opensea.js

      - name: Check normalizer module
        run: node --check src/normalizer.js

      - name: Check gates module
        run: node --check src/gates.js

      - name: Check stage module
        run: node --check src/stage.js

      - name: Check execution module
        run: node --check src/execution.js

      - name: Check creator module
        run: node --check src/creator.js

      - name: Check metadata module
        run: node --check src/metadata.js

      - name: Check market module
        run: node --check src/market.js

      - name: Check risk module
        run: node --check src/risk.js

      - name: Check score module
        run: node --check src/score.js

      - name: Verify OpenSea API Key
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: |
          if [ -z "$OPENSEA_API_KEY" ]; then
            echo "Missing OPENSEA_API_KEY"
            exit 1
          fi

          echo "OpenSea API key detected."

      - name: Test OpenSea Drops
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: |
          node --input-type=module <<'EOF'
          import { getUpcomingDrops } from "./src/opensea.js";

          const result = await getUpcomingDrops(process.env.OPENSEA_API_KEY);

          console.log(`Drops returned: ${result.drops.length}`);

          for (const drop of result.drops) {
            console.log(drop.collection_name);
          }
          EOF

      - name: Test Creator Intelligence (All Drops)
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: |
          node --input-type=module <<'EOF'
          import { getUpcomingDrops } from "./src/opensea.js";
          import { normalizeDrop } from "./src/normalizer.js";
          import { analyzeCreator } from "./src/creator.js";

          const result = await getUpcomingDrops(process.env.OPENSEA_API_KEY);

          for (const drop of result.drops) {
            const candidate = normalizeDrop(drop);

            const creatorIntel = await analyzeCreator(
              candidate,
              process.env.OPENSEA_API_KEY
            );

            console.log(
              JSON.stringify(
                {
                  collection: candidate.identity.name,
                  creator: creatorIntel.identity.username,
                  address: creatorIntel.address,
                  historicalCollections:
                    creatorIntel.historicalCollections.collectionCount,
                  analyzedCollections:
                    creatorIntel.historicalCollections.analyzedCollections,
                  highVolumeCollections:
                    creatorIntel.historicalCollections.highVolumeCollections,
                  highSalesCollections:
                    creatorIntel.historicalCollections.highSalesCollections,
                  highFloorCollections:
                    creatorIntel.historicalCollections.highFloorCollections
                },
                null,
                2
              )
            );
          }
          EOF

      - name: Run Sentinel
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: npm run scan

      - name: Show Sentinel Report
        run: cat output/sentinel_report.json
