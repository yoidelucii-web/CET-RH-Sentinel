name: CET RH Sentinel

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Sentinel
        run: npm run scan
        
      - name: Check OpenSea module
        run: node --check src/opensea.js
        
      - name: Check normalizer module
        run: node --check src/normalizer.js
        
      - name: Check gates module
        run: node --check src/gates.js
        
      - name: Test OpenSea drops
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: |
          node --input-type=module <<'EOF'
          import { getUpcomingDrops } from "./src/opensea.js";

          const result = await getUpcomingDrops(process.env.OPENSEA_API_KEY);

          console.log(JSON.stringify(result, null, 2));
          EOF

      - name: Test normalizer
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: |
          node --input-type=module <<'EOF'
          import { getUpcomingDrops } from "./src/opensea.js";
          import { normalizeDrop } from "./src/normalizer.js";

          const result = await getUpcomingDrops(process.env.OPENSEA_API_KEY);

          if (!result.drops || result.drops.length === 0) {
            throw new Error("No drops returned by OpenSea");
          }

          const candidate = normalizeDrop(result.drops[0]);

          console.log(JSON.stringify(candidate, null, 2));
          EOF

      - name: Test hard gates
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: |
          node --input-type=module <<'EOF'
          import { getUpcomingDrops } from "./src/opensea.js";
          import { normalizeDrop } from "./src/normalizer.js";
          import { evaluateHardGates } from "./src/gates.js";

          const result = await getUpcomingDrops(process.env.OPENSEA_API_KEY);

          if (!result.drops || result.drops.length === 0) {
            throw new Error("No drops returned by OpenSea");
          }

          for (const drop of result.drops) {
            const candidate = normalizeDrop(drop);
            const gates = evaluateHardGates(candidate);

            console.log(
              JSON.stringify(
                {
                  name: candidate.identity.name,
                  stage: candidate.mint.type,
                  passed: gates.passed,
                  reasons: gates.reasons
                },
                null,
                2
              )
            );
          }
          EOF
          
      - name: Test OpenSea API key
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: |
          if [ -z "$OPENSEA_API_KEY" ]; then
            echo "OpenSea API key is missing"
            exit 1
          fi
          echo "OpenSea API key is available"

      - name: Test OpenSea API
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: |
          curl -sS \
            -H "X-API-KEY: $OPENSEA_API_KEY" \
            "https://api.opensea.io/api/v2/collections?chain=robinhood&limit=1"

      - name: Show report
        run: cat output/sentinel_report.json
