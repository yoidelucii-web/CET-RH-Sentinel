name: CET RH Sentinel

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Sentinel
        run: npm run scan

      - name: Test OpenSea API key
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: |
          if [ -z "$OPENSEA_API_KEY" ]; then
            echo "OpenSea API key is missing"
            exit 1
          fi
          echo "OpenSea API key is available"

      - name: Show report
        run: cat output/sentinel_report.json
