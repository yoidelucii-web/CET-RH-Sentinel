name: CET RH Sentinel

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CET RH Sentinel
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: npm run scan

      - name: Show scan report
        run: |
          echo "======================================"
          echo "      CET RH SENTINEL AUTOMATED SCAN"
          echo "======================================"
          echo ""

          if [ -f output/sentinel_report.json ]; then
            node -e '
              const fs = require("fs");

              const report = JSON.parse(
                fs.readFileSync(
                  "output/sentinel_report.json",
                  "utf8"
                )
              );

              const s = report.summary || {};

              console.log(
                "Scan Time          :",
                report.scanTime
              );

              console.log(
                "Network            :",
                report.network
              );

              console.log(
                "Total Drops        :",
                s.totalDrops
              );

              console.log(
                "Execution Eligible :",
                s.executionEligible
              );

              console.log(
                "Auto Mint Approved :",
                s.autoMintApproved
              );

              console.log(
                "Auto Mint Blocked  :",
                s.autoMintBlocked
              );

              console.log(
                "Average Score      :",
                s.averageScore
              );

              console.log(
                "Top Candidate      :",
                s.topCandidate?.name || "None"
              );

              console.log("");
              console.log("TOP FIVE");
              console.log("========");

              (s.topFive || []).forEach((item) => {
                console.log(
                  `#${item.rank} [${item.tier}] ${item.name} | ${item.score}/100 | ${item.classification}`
                );
              });
            '
          else
            echo "ERROR: sentinel_report.json not found"
            exit 1
          fi

      - name: Send Telegram alert
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ 8273244106:AAEKb-pS1HJiGdZ1nwX6dn1Bkfp1ltnV_y0 }}
          TELEGRAM_CHAT_ID: ${{ 1434177207 }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const https = require("https");

          const report = JSON.parse(
            fs.readFileSync(
              "output/sentinel_report.json",
              "utf8"
            )
          );

          const summary = report.summary || {};
          const candidates = report.candidates || [];

          const approved = candidates.filter(
            (c) =>
              c.executionApproval?.status ===
              "AUTO_MINT_APPROVED"
          );

          const highScore = candidates.filter(
            (c) =>
              Number(c.goldenEgg?.score || 0) >= 90
          );

          const important = [
            ...approved,
            ...highScore
          ].filter(
            (candidate, index, array) =>
              array.findIndex(
                (x) =>
                  x.identity?.name === candidate.identity?.name ||
                  x.name === candidate.name
              ) === index
          );

          if (important.length === 0) {
            console.log(
              "No important candidate. Telegram notification skipped."
            );
            process.exit(0);
          }

          const lines = [];

          lines.push("🚨 CET RH SENTINEL ALERT");
          lines.push("");
          lines.push(
            `🕐 Scan: ${report.scanTime}`
          );
          lines.push(
            `🌐 Network: ${report.network || "robinhood"}`
          );
          lines.push("");

          for (const candidate of important) {

            const name =
              candidate.name ||
              candidate.identity?.name ||
              "Unknown";

            const score =
              candidate.goldenEgg?.score ??
              0;

            const classification =
              candidate.goldenEgg?.classification ||
              "UNKNOWN";

            const stage =
              candidate.stageClassification ||
              candidate.stage ||
              "UNKNOWN";

            const execution =
              candidate.executionApproval?.status ||
              candidate.executionStatus ||
              "UNKNOWN";

            const risk =
              candidate.riskIntel?.score ??
              "UNKNOWN";

            const price =
              candidate.mint?.priceWei ||
              candidate.mint?.price ||
              "UNKNOWN";

            lines.push(`🔥 ${name}`);
            lines.push(`Score: ${score}/100`);
            lines.push(`Class: ${classification}`);
            lines.push(`Stage: ${stage}`);
            lines.push(`Risk: ${risk}/40`);
            lines.push(`Execution: ${execution}`);
            lines.push(`Mint Price: ${price}`);

            if (
              candidate.identity?.contract
            ) {
              lines.push(
                `Contract: ${candidate.identity.contract}`
              );
            }

            if (
              candidate.opensea?.url
            ) {
              lines.push(
                `OpenSea: ${candidate.opensea.url}`
              );
            }

            if (
              candidate.executionApproval?.blockers?.length
            ) {
              lines.push(
                `Blockers: ${candidate.executionApproval.blockers.join(", ")}`
              );
            }

            lines.push("");
          }

          lines.push(
            `Top Candidate: ${summary.topCandidate?.name || "None"}`
          );

          lines.push(
            `Average Score: ${summary.averageScore ?? "N/A"}`
          );

          const message =
            lines.join("\n");

          const token =
            process.env.TELEGRAM_BOT_TOKEN;

          const chatId =
            process.env.TELEGRAM_CHAT_ID;

          if (!token || !chatId) {
            console.error(
              "Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID."
            );
            process.exit(1);
          }

          const body =
            new URLSearchParams({
              chat_id: chatId,
              text: message,
              disable_web_page_preview: "true"
            }).toString();

          const request =
            https.request(
              {
                hostname: "api.telegram.org",
                path: `/bot${token}/sendMessage`,
                method: "POST",
                headers: {
                  "Content-Type":
                    "application/x-www-form-urlencoded",
                  "Content-Length":
                    Buffer.byteLength(body)
                }
              },
              (response) => {

                let data = "";

                response.on(
                  "data",
                  (chunk) => {
                    data += chunk;
                  }
                );

                response.on(
                  "end",
                  () => {

                    if (
                      response.statusCode < 200 ||
                      response.statusCode >= 300
                    ) {
                      console.error(
                        "Telegram API error:",
                        data
                      );

                      process.exit(1);
                    }

                    console.log(
                      "Telegram notification sent successfully."
                    );
                  }
                );
              }
            );

          request.on(
            "error",
            (error) => {
              console.error(
                "Telegram request failed:",
                error.message
              );

              process.exit(1);
            }
          );

          request.write(body);
          request.end();
          NODE

      - name: Commit updated sentinel report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/sentinel_report.json

          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore: update sentinel scan report"
            git push
          fi
```
