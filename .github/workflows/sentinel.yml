name: CET RH Sentinel

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check OpenSea module
        run: node --check src/opensea.js

      - name: Check normalizer module
        run: node --check src/normalizer.js

      - name: Check gates module
        run: node --check src/gates.js

      - name: Check stage module
        run: node --check src/stage.js

      - name: Check execution module
        run: node --check src/execution.js

      - name: Check creator module
        run: node --check src/creator.js

      - name: Check metadata module
        run: node --check src/metadata.js

      - name: Check market module
        run: node --check src/market.js

      - name: Check risk module
        run: node --check src/risk.js

      - name: Check score module
        run: node --check src/score.js

      - name: Test OpenSea API key
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: |
          if [ -z "$OPENSEA_API_KEY" ]; then
            echo "OpenSea API key is missing"
            exit 1
          fi

          echo "OpenSea API key is available"

      - name: Test OpenSea drops
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: |
          node --input-type=module <<'EOF'
          import { getUpcomingDrops } from "./src/opensea.js";

          const result = await getUpcomingDrops(
            process.env.OPENSEA_API_KEY
          );

          if (!result.drops || result.drops.length === 0) {
            throw new Error("No drops returned by OpenSea");
          }

          console.log(`Drops returned: ${result.drops.length}`);
          EOF

      - name: Test Creator Intelligence
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: |
          node --input-type=module <<'EOF'
          import { getUpcomingDrops } from "./src/opensea.js";
          import { normalizeDrop } from "./src/normalizer.js";
          import { analyzeCreator } from "./src/creator.js";

          const result = await getUpcomingDrops(
            process.env.OPENSEA_API_KEY
          );

          if (!result.drops || result.drops.length === 0) {
            throw new Error("No drops returned by OpenSea");
          }

          const candidate = normalizeDrop(
            result.drops[0]
          );

          const creatorIntel = await analyzeCreator(
            candidate,
            process.env.OPENSEA_API_KEY
          );

          console.log(
            JSON.stringify(
              {
                name: candidate.identity.name,
                creatorIntel
              },
              null,
              2
            )
          );
          EOF

      - name: Test Metadata Intelligence
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: |
          node --input-type=module <<'EOF'
          import { getUpcomingDrops } from "./src/opensea.js";
          import { normalizeDrop } from "./src/normalizer.js";
          import { analyzeMetadata } from "./src/metadata.js";

          const result = await getUpcomingDrops(
            process.env.OPENSEA_API_KEY
          );

          if (!result.drops || result.drops.length === 0) {
            throw new Error("No drops returned by OpenSea");
          }

          const candidate = normalizeDrop(
            result.drops[0]
          );

          const metadataIntel = await analyzeMetadata(
            candidate,
            process.env.OPENSEA_API_KEY
          );

          console.log(
            JSON.stringify(
              {
                name: candidate.identity.name,
                metadataIntel
              },
              null,
              2
            )
          );
          EOF

      - name: Test Market Intelligence
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: |
          node --input-type=module <<'EOF'
          import { getUpcomingDrops } from "./src/opensea.js";
          import { normalizeDrop } from "./src/normalizer.js";
          import { analyzeMarket } from "./src/market.js";

          const result = await getUpcomingDrops(
            process.env.OPENSEA_API_KEY
          );

          if (!result.drops || result.drops.length === 0) {
            throw new Error("No drops returned by OpenSea");
          }

          const candidate = normalizeDrop(
            result.drops[0]
          );

          const marketIntel = await analyzeMarket(
            candidate,
            process.env.OPENSEA_API_KEY
          );

          console.log(
            JSON.stringify(
              {
                name: candidate.identity.name,
                marketIntel
              },
              null,
              2
            )
          );
          EOF

      - name: Test Risk Engine
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: |
          node --input-type=module <<'EOF'
          import { getUpcomingDrops } from "./src/opensea.js";
          import { normalizeDrop } from "./src/normalizer.js";
          import { analyzeCreator } from "./src/creator.js";
          import { analyzeMetadata } from "./src/metadata.js";
          import { analyzeMarket } from "./src/market.js";
          import { calculateRisk } from "./src/risk.js";

          const result = await getUpcomingDrops(
            process.env.OPENSEA_API_KEY
          );

          if (!result.drops || result.drops.length === 0) {
            throw new Error("No drops returned by OpenSea");
          }

          const candidate = normalizeDrop(
            result.drops[0]
          );

          const creatorIntel = await analyzeCreator(
            candidate,
            process.env.OPENSEA_API_KEY
          );

          const metadataIntel = await analyzeMetadata(
            candidate,
            process.env.OPENSEA_API_KEY
          );

          const marketIntel = await analyzeMarket(
            candidate,
            process.env.OPENSEA_API_KEY
          );

          const enrichedCandidate = {
            ...candidate,
            creatorIntel,
            metadataIntel,
            marketIntel
          };

          const riskIntel = calculateRisk(
            enrichedCandidate
          );

          console.log(
            JSON.stringify(
              {
                name: candidate.identity.name,
                riskIntel
              },
              null,
              2
            )
          );
          EOF

      - name: Test Golden Egg Score
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: |
          node --input-type=module <<'EOF'
          import { getUpcomingDrops } from "./src/opensea.js";
          import { normalizeDrop } from "./src/normalizer.js";
          import { analyzeCreator } from "./src/creator.js";
          import { analyzeMetadata } from "./src/metadata.js";
          import { analyzeMarket } from "./src/market.js";
          import { calculateRisk } from "./src/risk.js";
          import { calculateGoldenEggScore } from "./src/score.js";

          const result = await getUpcomingDrops(
            process.env.OPENSEA_API_KEY
          );

          if (!result.drops || result.drops.length === 0) {
            throw new Error("No drops returned by OpenSea");
          }

          const candidate = normalizeDrop(
            result.drops[0]
          );

          const creatorIntel = await analyzeCreator(
            candidate,
            process.env.OPENSEA_API_KEY
          );

          const metadataIntel = await analyzeMetadata(
            candidate,
            process.env.OPENSEA_API_KEY
          );

          const marketIntel = await analyzeMarket(
            candidate,
            process.env.OPENSEA_API_KEY
          );

          const enrichedCandidate = {
            ...candidate,
            creatorIntel,
            metadataIntel,
            marketIntel
          };

          const riskIntel = calculateRisk(
            enrichedCandidate
          );

          const finalCandidate = {
            ...enrichedCandidate,
            riskIntel
          };

          const scoring = calculateGoldenEggScore(
            finalCandidate
          );

          console.log(
            JSON.stringify(
              {
                name: candidate.identity.name,
                score: scoring.score,
                maxScore: scoring.maxScore,
                classification: scoring.classification,
                rawScore: scoring.rawScore,
                riskPenalty: scoring.riskPenalty,
                breakdown: scoring.breakdown
              },
              null,
              2
            )
          );
          EOF

      - name: Run Sentinel
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: npm run scan

      - name: Show report
        run: cat output/sentinel_report.json
